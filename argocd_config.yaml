apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rails-events
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BasilMawejje/rails-events.git
    targetRevision: HEAD
    path: .k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true # Deletes things in K8s if you delete them in Git
      selfHeal: true # Recreates things if you manually delete them with kubectl
